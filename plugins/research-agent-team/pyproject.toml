[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-agent-team"
version = "0.1.0"
description = "Installable Codex plugin and local filesystem-first helper layer for ResearchAgentTeam."
requires-python = ">=3.9"
dependencies = [
  "pydantic>=2,<3",
  "PyYAML>=6,<7",
]

[project.scripts]
research-agent-team-codex = "research_agent_team.platform.codex.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["research_agent_team*"]
