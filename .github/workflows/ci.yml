name: CI

on:
  push:
    branches:
      - main
      - phase1-monorepo-backfill
  pull_request:

jobs:
  monorepo-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install workspace dependencies
        run: uv sync --group dev

      - name: Run test suite
        run: uv run pytest

      - name: Validate plugin release boundary
        run: bash scripts/validate-release-boundary.sh

      - name: Smoke test plugin CLI
        run: bash scripts/smoke-test-plugin.sh

      - name: Build plugin package artifact
        run: bash scripts/package-plugin.sh
